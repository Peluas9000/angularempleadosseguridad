<h1>Login Seguridad OAuth</h1>
<h3 style="color: red">{{ mensaje }}</h3>

<form #formLogin="ngForm" >
    <label>Usuario: </label>
    <input type="text" name="cajausuario"  class="form-control" /><br/>
    
    <label>Password: </label>
    <input type="password" name="cajapassword"  class="form-control" /><br/>
    
    <button (click)="realizarLogin()" class="btn btn-primary">Iniciar Sesión</button>
</form>
